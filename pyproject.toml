[project]
name = "compas-scoring"
version = "0.1.0"
description = "Trustworthy-AI scoring analysis on the COMPAS two-year recidivism cohort: white-box vs ML vs tabular foundation model, compared on performance, interpretability, stability and fairness."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }

dependencies = [
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "xgboost>=3.1",
    "statsmodels>=0.14",
    "shap>=0.52",
    "fairlearn>=0.14",
    # Tabular foundation model. Pinned to the v2 line (Hollmann et al., Nature 2025)
    # deliberately: tabpfn >=9 gates weight downloads behind a Prior Labs account and
    # TABPFN_TOKEN, which a reproducible course deliverable should not depend on.
    # v2.2.1 fetches its weights from HuggingFace with no account. Verified by `make smoke`.
    "tabpfn==2.2.1",
    # Second tabular foundation model, used as a cross-check so the TFM findings are not
    # an artifact of one architecture.
    "tabicl>=2.2",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "plotly>=5.24",
    "streamlit>=1.45",
    "lime>=0.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "ruff>=0.8",
    "pytest>=8.3",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compas_scoring"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: re-derives an expensive result (deselect with '-m \"not slow\"')",
]

# ---------------------------------------------------------------------------
# Project constants. Single source of truth: read by compas_scoring.config, so
# the notebook, the Streamlit app, the web app and the deck all quote the same
# numbers. Do not duplicate any of these values in code.
# ---------------------------------------------------------------------------
[tool.compas_scoring]
random_state = 42
test_size = 0.3

# Target and the incumbent-model column. score_factor is COMPAS's own
# decile>4 output: it is the benchmark, never a predictor (using it would
# leak the incumbent model into our features).
data_path = "data/archive/propublicaCompassRecividism_data_fairml.csv/propublica_data_for_fairml.csv"
target = "Two_yr_Recidivism"
incumbent = "score_factor"

# Expected shape of the modelling table, asserted at load time.
expected_rows = 6172
expected_base_rate = 0.4551

# The modelling table carries no dates, so the time-ordered stability design runs on a
# dated cohort rebuilt from the raw ProPublica export (see data.load_dated).
dated_data_path = "data/cox-violent-parsed.csv"

[tool.compas_scoring.splits]
# Stability design 1: stratified random partition X1 / X2 / X3 of the modelling table.
# Train on X1 and on X2, test both on the shared reference set X3.
partition = [0.4, 0.4, 0.2]
# Stability design 2: time-ordered windows on the dated cohort, as [train_end, test_end]
# fractions of the date-sorted rows: train on [0, train_end), test on [train_end, test_end).
temporal_windows = [[0.4, 0.6], [0.7, 1.0]]

[tool.compas_scoring.features]
# Race-aware: every predictor except the target and the incumbent benchmark.
race_aware = [
    "Number_of_Priors",
    "Age_Above_FourtyFive",
    "Age_Below_TwentyFive",
    "African_American",
    "Asian",
    "Hispanic",
    "Native_American",
    "Other",
    "Female",
    "Misdemeanor",
]
# Race-blind: the "fairness through unawareness" variant. The analysis shows
# this does not remove disparity, because priors proxies for race.
race_blind = [
    "Number_of_Priors",
    "Age_Above_FourtyFive",
    "Age_Below_TwentyFive",
    "Female",
    "Misdemeanor",
]
# Protected-attribute ablations: the race-aware set minus one protected attribute at a time,
# and minus all of them. They measure what each attribute contributes to performance; the
# fairness analysis measures what removing it does (or does not do) to disparity.
sex_blind = [
    "Number_of_Priors",
    "Age_Above_FourtyFive",
    "Age_Below_TwentyFive",
    "African_American",
    "Asian",
    "Hispanic",
    "Native_American",
    "Other",
    "Misdemeanor",
]
age_blind = [
    "Number_of_Priors",
    "African_American",
    "Asian",
    "Hispanic",
    "Native_American",
    "Other",
    "Female",
    "Misdemeanor",
]
protected_blind = [
    "Number_of_Priors",
    "Misdemeanor",
]
race_dummies = [
    "African_American",
    "Asian",
    "Hispanic",
    "Native_American",
    "Other",
]

[tool.compas_scoring.costs]
# Pretrial decision costs, in USD. These are client-configurable assumptions,
# not empirical constants -- the analysis reports sensitivity across the whole
# ratio range rather than treating these defaults as ground truth.
#   c_fn: released, then re-offends (victim + re-arrest + re-processing)
#   c_fp: detained, would not have re-offended (detention + wrongful liberty)
c_fn = 40000
c_fp = 13500
detention_days = 90
detention_cost_per_day = 150

[tool.compas_scoring.iterations]
bootstrap_ci = 2000      # bootstrap resamples for AUC confidence intervals
bootstrap_refits = 100   # refits for prediction / explanation stability
cv_repeats = 30          # repeats of stratified 5-fold CV
cv_folds = 5
n_seeds = 10             # seed-sensitivity refits
learning_curve_sizes = [250, 500, 1000, 2000, 4000]

# KernelSHAP budget for the foundation models. Cost is n_explain x n_samples x
# n_background forward passes; TabPFN sustains ~800 rows/s here, so 25 x 256 x 25
# is ~200s per model. Deliberately small -- the point is to measure what post-hoc
# explanation of a foundation model costs, not to pretend it is cheap.
shap_background = 25
shap_explain = 25
shap_nsamples = 256

# Foundation models take ~8s per fit+predict cycle against ~0.02s for logistic
# regression -- a 400x gap. Running them at the full resampling budget would take
# hours, so they run at 1/slow_divisor of it. The asymmetry is reported as a
# finding about operational cost, not hidden as an implementation detail.
slow_models = ["tabpfn", "tabicl"]
slow_divisor = 4
